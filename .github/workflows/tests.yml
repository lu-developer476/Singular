name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: singular examples/square.sg
      - run: singular format --check examples/square.sg
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install and smoke-test wheel
        run: |
          python -m venv "$RUNNER_TEMP/singular-wheel-venv"
          "$RUNNER_TEMP/singular-wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/singular-wheel-venv/bin/singular" examples/square.sg
          "$RUNNER_TEMP/singular-wheel-venv/bin/singular" format --check examples/square.sg
